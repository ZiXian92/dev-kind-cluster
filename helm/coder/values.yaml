coder:
  envFrom:
    - configMapRef:
        name: coder
    - secretRef:
        name: coder
  envUseClusterAccessURL: false
  serviceAccount:
    workspaceNamespaces:
      - name: dev-ws
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  service:
    enable: true
    type: ClusterIP
  certs:
    secrets:
      - name: localtest-ca-bundle
        key: ca-bundle.crt
  securityContext:
    capabilities:
      drop:
        - ALL
      add:
        - NET_BIND_SERVICE
